name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring. versionName keeps the
      # major.minor from the build file and takes the run number as its patch, so the tag
      # moves on every push and Obtainium always has something newer to offer.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # The signing key is committed rather than a secret — see app/build.gradle.kts for why.
      # This step exists to fail loudly if that ever stops being true, because the fallback is
      # a debug-signed APK that installs fine and can never update a real release.
      - name: Confirm the release was signed with the release key
        run: |
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo '::error::no app-release.apk — the release was built unsigned'; exit 1; }

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/BrightRolodex-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/BrightRolodex-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever changes,
      # Obtainium updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed to
      # something like res/AB.png inside the zip. Ask the package what its icon is instead
      # of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      # This app writes to the address book and draws faces; it has no business on the
      # network and asks for no network permission. A dependency that quietly adds INTERNET
      # would be a real change in what the app is, so fail on it rather than notice later.
      - name: Verify the app asks for no network permission
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions out/*.apk > perms.txt
          cat perms.txt
          # An `if`, not `grep ... && { exit 1; }`. Under the default `bash -e` the second form
          # is also the last command in the script when it succeeds-at-not-matching, and a
          # non-matching grep then decides the step's exit code.
          if grep -q 'android.permission.INTERNET' perms.txt; then
            echo '::error::something pulled in INTERNET'
            exit 1
          fi
          echo "no INTERNET permission, as intended"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightRolodex-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightRolodex-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Rolodex v${{ steps.ver.outputs.version }}
          files: out/BrightRolodex-v${{ steps.ver.outputs.version }}.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub schedules are
      # best-effort — observed 70 minutes apart against a 15 minute schedule — so without this
      # a new release can sit uncatalogued for over an hour and simply not appear as an update.
      #
      # INDEX_DISPATCH_TOKEN does not exist in this repository yet, so this is expected to fail
      # until it is added. continue-on-error and the `||` both matter: a missing token must not
      # fail a release that already succeeded.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
