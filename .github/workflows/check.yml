name: Check

# Compiles and tests without publishing anything.
#
# A push to main cuts a signed release that reaches the phone within minutes, so main is a bad
# place to find out that something does not compile. Every other branch runs this instead:
# the same build, with disposable signing keys and no release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The release build too. Everything that can go wrong in this app's packaging is
      # release-only: R8 full mode and resource shrinking against a Compose-only app whose
      # only reflection surface is the parts table.
      - name: Compile
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Test release signer rotation
        shell: bash
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/brightrolodex-rotation-test.XXXXXX")
          trap 'rm -rf -- "$test_dir"' EXIT
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          export KEYSTORE_PASSWORD="$(openssl rand -hex 18)" KEY_PASSWORD="$(openssl rand -hex 18)"
          for alias in original rotated; do
            keytool -genkeypair -storetype JKS -keystore "$test_dir/$alias.jks" -alias "$alias" \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=BrightRolodex Disposable $alias"
            keytool -exportcert -keystore "$test_dir/$alias.jks" -alias "$alias" -storepass:env KEYSTORE_PASSWORD \
              | sha256sum | cut -d ' ' -f 1 > "$test_dir/$alias.txt"
          done
          export KEYSTORE_FILE="$test_dir/rotated.jks" KEY_ALIAS=rotated SIGNING_LINEAGE_FILE="$test_dir/signing.lineage"
          "$apksigner" rotate --out "$SIGNING_LINEAGE_FILE" \
            --old-signer --ks "$test_dir/original.jks" --ks-key-alias original \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --set-installed-data true --set-rollback false \
            --new-signer --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
          bash scripts/sign-release.sh "$unsigned" "$test_dir/rotated.apk" "$test_dir/original.txt" "$test_dir/rotated.txt"

          printf '%064d\n' 0 > "$test_dir/wrong-root.txt"
          if bash scripts/sign-release.sh "$unsigned" "$test_dir/wrong-root.apk" "$test_dir/wrong-root.txt" "$test_dir/rotated.txt" > "$test_dir/rejection.log"; then
            echo '::error::Release signing accepted an unexpected lineage root'
            exit 1
          fi
          grep -Fx '::error::APK lineage must link the pinned original and rotated certificates' "$test_dir/rejection.log"

      - name: Report APK size
        run: |
          # Globbed, not spelled out. A release with no usable keystore is named
          # app-release-unsigned.apk, and a hard-coded path silently checks nothing.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release APK is $(du -h "$APK" | cut -f1) — $APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightRolodex-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
