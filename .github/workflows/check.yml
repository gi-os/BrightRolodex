name: Check

# Compiles and tests without publishing anything.
#
# A push to main cuts a signed release that reaches the phone within minutes, so main is a bad
# place to find out that something does not compile. Every other branch runs this instead:
# the same build, minus the signing checks and the release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The release build too. Everything that can go wrong in this app's packaging is
      # release-only: R8 full mode and resource shrinking against a Compose-only app whose
      # only reflection surface is the parts table.
      - name: Compile
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report APK size
        run: |
          # Globbed, not spelled out. A release with no usable keystore is named
          # app-release-unsigned.apk, and a hard-coded path silently checks nothing.
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release APK is $(du -h "$APK" | cut -f1) — $APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightRolodex-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
